<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cont - Casa Mobilei</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        .auth-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            overflow: hidden;
            max-width: 420px;
            margin: 60px auto;
        }

        .auth-header {
            background: linear-gradient(90deg, #0d6efd, #6610f2);
            color: white;
            padding: 2.5rem 1.5rem;
            text-align: center;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13,110,253,.25);
        }

        .btn-auth {
            padding: 12px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <h3 class="mb-0">Bine ai venit la Casa Mobilei</h3>
            <p class="mb-0 mt-2">Contul tău personal</p>
        </div>

        <div class="p-4 p-md-5">
            <ul class="nav nav-tabs mb-4" id="authTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Intră în cont</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Creează cont</button>
                </li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="login" role="tabpanel">
                    <form>
                        <div class="mb-4">
                            <label class="form-label">Email sau nume utilizator</label>
                            <input type="email" class="form-control form-control-lg" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Parolă</label>
                            <input type="password" class="form-control form-control-lg" required>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember">
                                <label class="form-check-label" for="remember">Ține-mă minte</label>
                            </div>
                            <a href="#" class="text-muted small">Ai uitat parola?</a>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 btn-auth">Autentifică-te</button>
                    </form>
                </div>

                <div class="tab-pane fade" id="register" role="tabpanel">
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Prenume</label>
                                <input type="text" class="form-control form-control-lg" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Nume</label>
                                <input type="text" class="form-control form-control-lg" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control form-control-lg" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Parolă</label>
                                <input type="password" class="form-control form-control-lg" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Confirmă parola</label>
                                <input type="password" class="form-control form-control-lg" required>
                            </div>
                        </div>
                        <div class="mt-4">
                            <button type="submit" class="btn btn-success btn-lg w-100 btn-auth">Creează cont</button>
                        </div>
                        <p class="text-center mt-4 mb-0 small text-muted">
                            Prin înregistrare accepți <a href="#">termenii și condițiile</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
